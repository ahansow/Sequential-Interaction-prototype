<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Darkroom Developer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one column. A load screen first, then the darkroom: header (step + instruction), the bench where the photo lives, and a single control that changes each step. Single dark look on purpose: it is a darkroom. */
:root {
  --bg: #0b0807;
  --ink: #e3d9cc;
  --dim: #7a6d63;
  --safe: #d0402e;
  --glow: #ffd9a8;
  --paper: #ece6da;
  --tray: #15100e;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.5;
  margin: 0;
  padding-block: 24px 56px;
  padding-inline: 16px;
}
#lamp {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0;
  background: radial-gradient(ellipse at 50% 30%, rgba(255,160,110,.22), rgba(0,0,0,0) 65%);
  transition: opacity 1.4s ease;
}
#flood { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0; background: #ffe9d6; }
#app { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; overflow-x: clip; --ar: .8; }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; min-height: 44px; }
.brand { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); margin: 0; }
#back { font-size: 13px; letter-spacing: .06em; padding: 12px 0 12px 12px; }
header { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
#dots { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
#dots li {
  font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  border: 1px dashed var(--dim); color: var(--dim); padding: 4px 10px;
}
#dots li.current { border: 1px solid var(--safe); color: var(--ink); }
#dots li.done { border: 1px solid var(--dim); color: var(--ink); background: rgba(255,255,255,.05); }
h1 { font-size: clamp(22px, 5vw, 30px); font-weight: 500; margin: 0; text-wrap: balance; }
#stephint { margin: 0; color: var(--dim); min-height: 1.5em; }

/* Load screen */
#intro { display: flex; flex-direction: column; gap: 20px; align-items: flex-start; padding-top: 8px; }
#intro p { margin: 0; color: var(--dim); max-width: 52ch; }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.linkbtn { font: inherit; color: var(--dim); background: none; border: 0; padding: 12px 4px; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
.linkbtn:hover { color: var(--ink); }
.linkbtn:focus-visible { outline: 2px solid var(--safe); outline-offset: 3px; }
#err { color: #f08a7a; min-height: 1.5em; }
#dropnote { font-size: 13px; }
body.dragging #intro { outline: 2px dashed var(--safe); outline-offset: 12px; }
#file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.bench {
  display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; align-items: flex-start;
  min-height: 300px; margin-bottom: 24px;
}
.bench > * { min-width: 0; }
/* Easel width follows the photo's shape so tall photos never push the controls off a phone screen */
.easel { width: min(360px, 100%, calc(46vh * var(--ar) + 28px)); border: 1px dashed var(--dim); padding: 14px; background: #050403; }
.easel canvas { display: block; width: 100%; height: auto; aspect-ratio: var(--ar); transition: filter .9s ease, opacity .8s ease; filter: blur(16px) brightness(.16); }

.paper {
  width: 190px; max-width: 100%; background: var(--paper); padding: 10px 10px 30px;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: grab; position: relative; z-index: 3;
}
.paper.lifted { cursor: grabbing; transform-origin: center; }
.paper.in-tray { cursor: default; }
.paper:focus-visible { outline: 2px solid var(--safe); outline-offset: 4px; }
.paper canvas { display: block; width: 100%; height: auto; aspect-ratio: var(--ar); opacity: 0; filter: invert(1) contrast(.5) brightness(1.2); }
/* In the developer the print appears as a negative, then flips to a positive */
@keyframes develop {
  0%   { opacity: 0; filter: invert(1) contrast(.5) brightness(1.2); }
  18%  { opacity: 1; filter: invert(1) contrast(.95) brightness(1); }
  100% { opacity: 1; filter: invert(0) contrast(1) brightness(1); }
}
.paper.developing canvas { animation: develop 9s ease-in-out forwards; }
.paper.revealed { overflow: hidden; }
.paper::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transform: translateX(-120%);
  background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.34) 50%, transparent 62%);
}
.paper.sheen::after { opacity: 1; animation: sheen 1.3s ease-out forwards; }
@keyframes sheen { from { transform: translateX(-120%); } to { transform: translateX(120%); } }
#ctl-5.fadein { animation: fadein .9s ease both; }
@keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.paper .grab { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #8a8174; }

.tray {
  width: 240px; max-width: 100%; height: 280px; border: 2px dashed var(--dim); background: var(--tray);
  position: relative; transition: border-color .2s, background .6s;
}
.tray.ready { border-color: var(--safe); }
.tray.active { background: #231713; border-style: solid; }
/* Tray and paper share one rocking motion (individual translate/rotate props, so the paper's drag transform is untouched) */
@keyframes agitate {
  0%   { translate: 0 0;      rotate: 0deg; }
  15%  { translate: -5px 2px; rotate: -1.4deg; }
  30%  { translate: 4px -2px; rotate: 1.2deg; }
  45%  { translate: -4px 1px; rotate: -1deg; }
  60%  { translate: 5px 2px;  rotate: 1.5deg; }
  80%  { translate: -3px -1px; rotate: -.8deg; }
  100% { translate: 0 0;      rotate: 0deg; }
}
.tray.agitating, .paper.agitating { animation: agitate 1.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .tray.agitating, .paper.agitating { animation-duration: 3s; } }
.tray span { position: absolute; top: 8px; left: 10px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

.controls { min-height: 150px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.controls [hidden] { display: none !important; }
.group { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }

.switch {
  font: inherit; color: var(--ink); background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent;
  display: flex; align-items: center; gap: 14px; border: 2px solid var(--ink); padding: 8px 16px 8px 8px;
}
.switch .track { width: 64px; height: 36px; border: 2px solid var(--ink); position: relative; }
.switch .knob { position: absolute; top: 2px; left: 2px; width: 28px; height: 28px; background: var(--ink); transition: left .2s, background .2s; }
.switch[aria-checked="true"] .knob { left: 30px; background: var(--safe); }
.switch .lbl { letter-spacing: .12em; font-size: 13px; width: 5.5ch; text-align: left; }
.switch:focus-visible, .btn:focus-visible, input[type=range]:focus-visible, .bulb:focus-visible { outline: 2px solid var(--safe); outline-offset: 4px; }

input[type=range] { width: min(420px, 100%); accent-color: var(--safe); height: 44px; cursor: pointer; }
input[type=range]:disabled { cursor: default; opacity: .6; }
.label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
#focus-state { min-height: 1.5em; }

.btn {
  font: inherit; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
  background: transparent; border: 2px solid var(--ink); padding: 14px 32px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.btn:hover:not(:disabled) { background: rgba(255,255,255,.08); }
.btn:disabled { opacity: .5; cursor: default; }

/* Hold-to-expose light bulb */
.bulb {
  position: relative; width: 128px; height: 128px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--ink);
  cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
.bulb:disabled { cursor: default; }
.bulb .ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ring circle { fill: none; stroke-width: 3; }
.ring .track { stroke: var(--dim); stroke-dasharray: 3 5; opacity: .75; }
.ring .prog { stroke: var(--safe); stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; transform: rotate(-90deg); transform-origin: 60px 60px; }
.bulb .icon {
  position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; translate: -50% -50%;
  fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
  transition: fill .12s ease, stroke .12s ease, filter .12s ease;
}
.bulb.on .icon { fill: var(--glow); stroke: var(--glow); filter: drop-shadow(0 0 16px rgba(255,190,120,.95)); }
.bulb.on .fil { stroke: #8f5f2e; }
.bulb.on { color: var(--glow); }
#exp-read { font-variant-numeric: tabular-nums; text-transform: none; font-size: 14px; }

#done-msg { font-size: clamp(24px, 6vw, 34px); font-weight: 500; margin: 0; }

@media (max-width: 560px) {
  .bench { flex-wrap: nowrap; gap: 16px; min-height: 0; }
  .paper { width: min(190px, 34vw); padding: 8px 8px 26px; }
  .tray { width: min(240px, 46vw); height: min(280px, 64vw); }
  .bulb { width: 144px; height: 144px; }
}

#done { margin-top: 4px; }
#done.fadein { animation: fadein .9s ease both; }
#done-sub { margin: 0; color: var(--dim); max-width: 46ch; }
#choose { font-size: 13px; letter-spacing: .06em; padding: 12px 0 12px 12px; white-space: nowrap; }
.topbar { flex-wrap: wrap; row-gap: 0; }
body.dragging #app { outline: 2px dashed var(--safe); outline-offset: 10px; }
</style>

<input type="file" id="file" accept="image/*">
<div id="lamp"></div>
<div id="flood"></div>

<div id="app">
  <div class="topbar">
    <p class="brand">Digital Darkroom &middot; Step 4 of 4</p>
    <button class="linkbtn" id="choose">Use your own photo</button>
  </div>
  <header>
    <ol id="dots" aria-label="Progress"><li data-i="1">Enlarger</li><li data-i="2">Focus</li><li data-i="3">Expose</li><li data-i="4">Develop</li></ol>
    <h1 id="stepname">Develop</h1>
    <p id="stephint">Drag the paper into the developer tray.</p>
  </header>
  <section class="bench" id="bench" aria-live="polite">
    <div class="paper" id="paper" tabindex="0" role="button" aria-label="Exposed photographic paper. Drag it into the developer tray, or press Enter to place it.">
      <canvas id="print" width="480" height="600"></canvas>
      <div class="grab" id="grab">Drag me</div>
    </div>
    <div class="tray" id="tray"><span>Developer</span></div>
  </section>
  <section class="controls">
    <div class="group" id="ctl-4">
      <span id="dev-text">Drag the paper into the developer tray.</span>
      <div id="dev-bar-wrap" style="width:min(420px,100%);height:8px;border:1px solid var(--dim)" hidden><i id="dev-fill" style="display:block;height:100%;width:0;background:var(--safe)"></i></div>
    </div>
    <div class="group" id="done" hidden>
      <p id="done-msg"></p>
      <p id="done-sub"></p>
      <button class="btn" id="save" hidden>Save photograph</button>
      <p id="save-note" role="status" style="margin:0;color:var(--dim);min-height:1.5em"></p>
      <button class="linkbtn" id="again">Try again</button>
    </div>
  </section>
</div>

<script>

  /* ---------- Step 4: develop (drag paper into tray) ---------- */
  var tx = 0, ty = 0, drag = null, placed = false;

  function applyMove(lift) {
    paper.style.transform = 'translate(' + tx + 'px,' + ty + 'px)' + (lift ? ' scale(1.04)' : '');
  }
  function centerInTray() {
    var pr = paper.getBoundingClientRect(), tr = tray.getBoundingClientRect();
    var cx = pr.left + pr.width / 2, cy = pr.top + pr.height / 2;
    return cx > tr.left && cx < tr.right && cy > tr.top && cy < tr.bottom;
  }
  paper.addEventListener('pointerdown', function (e) {
    if (placed) return;
    e.preventDefault();
    paper.setPointerCapture(e.pointerId);
    drag = { x: e.clientX - tx, y: e.clientY - ty };
    paper.style.transition = 'none';
    paper.classList.add('lifted');
    applyMove(true);
  });
  paper.addEventListener('pointermove', function (e) {
    if (!drag) return;
    tx = e.clientX - drag.x; ty = e.clientY - drag.y;
    applyMove(true);
    tray.classList.toggle('ready', centerInTray());
  });
  function endDrag() {
    if (!drag) return;
    drag = null;
    paper.classList.remove('lifted');
    var inside = centerInTray();
    tray.classList.remove('ready');
    if (inside) { dropInTray(); }
    else {
      tx = 0; ty = 0;
      paper.style.transition = 'transform .35s ease';
      applyMove(false);
    }
  }
  paper.addEventListener('pointerup', endDrag);
  paper.addEventListener('pointercancel', endDrag);
  paper.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  paper.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && !placed) { e.preventDefault(); dropInTray(); }
  });

  function dropInTray() {
    if (placed) return;
    placed = true;
    var pr = paper.getBoundingClientRect(), tr = tray.getBoundingClientRect();
    tx += (tr.left + tr.width / 2) - (pr.left + pr.width / 2);
    ty += (tr.top + tr.height / 2) - (pr.top + pr.height / 2) + 10;
    paper.style.transition = 'transform .45s ease';
    applyMove(false);
    paper.classList.add('in-tray');
    paper.removeAttribute('tabindex');
    grab.hidden = true;
    tray.classList.add('active');
    later(startDeveloping, 500);
  }

  function startDeveloping() {
    stepHint.textContent = 'Keep the paper in the tray. The negative is turning positive.';
    devText.textContent = 'Developing…';
    devBarWrap.hidden = false;
    devFill.style.transition = 'width ' + DEVELOP_MS + 'ms linear';
    devFill.style.width = '100%';
    paper.classList.add('developing');
    tray.classList.add('agitating');
    paper.classList.add('agitating');
    later(upgradePrint, 800);
    later(reveal, DEVELOP_MS + 300);
  }

  /* While the print develops, quietly swap in a sharper version so it holds up when it is shown large */
  function upgradePrint() {
    var c = renderFinal(1800);
    if (c.width <= print.width && c.height <= print.height) return;
    print.width = c.width; print.height = c.height;
    print.getContext('2d').drawImage(c, 0, 0);
  }

  /* The finish: lift the print out of the tray, glide it to the middle of the page, scale it up, settle with a light sweep */
  function reveal() {
    tray.classList.remove('agitating'); paper.classList.remove('agitating');
    ctl4.hidden = true;
    stepHint.textContent = 'Lifting the print out of the developer.';
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var vh = window.innerHeight;
    var pr = paper.getBoundingClientRect(), ar = app.getBoundingClientRect(), bench = $('bench'), br = bench.getBoundingClientRect();
    var sc = Math.max(1.2, Math.min(ar.width / pr.width, (vh * 0.66) / pr.height));
    var dx = (ar.left + ar.width / 2) - (pr.left + pr.width / 2);
    var dy = (br.top + 8 + pr.height * sc / 2) - (pr.top + pr.height / 2);
    var DUR = reduce ? 500 : 3000;

    /* room for the big print: the bench grows and pushes the controls down */
    bench.style.transition = 'min-height 1.5s cubic-bezier(.3,.7,.2,1)';
    bench.style.minHeight = Math.ceil(pr.height * sc + 20) + 'px';

    tray.style.transition = 'opacity 1.2s ease .15s, transform 1.4s ease';
    tray.style.opacity = 0; tray.style.transform = 'translateY(10px)';
    lamp.style.transition = 'opacity 2.4s ease'; lamp.style.opacity = 1;

    paper.classList.add('revealed');
    var t = function (x, y, k, r) { return 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(' + k.toFixed(3) + ') rotate(' + r + 'deg)'; };
    var a = paper.animate([
      { transform: t(tx, ty, 1, 0),                                                  offset: 0,    easing: 'cubic-bezier(.3,0,.2,1)' },
      { transform: t(tx, ty - 70, 1.1, -2.5),                                        offset: .27,  easing: 'cubic-bezier(.45,.05,.2,1)' },
      { transform: t(tx + dx * .55, ty + dy * .35 - 40, 1 + (sc - 1) * .45, 1.2),    offset: .62,  easing: 'cubic-bezier(.2,.7,.25,1)' },
      { transform: t(tx + dx, ty + dy, sc * 1.015, -.3),                             offset: .9,   easing: 'ease-out' },
      { transform: t(tx + dx, ty + dy, sc, 0),                                       offset: 1 }
    ], { duration: DUR, fill: 'forwards' });
    paper.animate([
      { boxShadow: '0 6px 18px rgba(0,0,0,.5)' },
      { boxShadow: '0 22px 46px rgba(0,0,0,.6)', offset: .3 },
      { boxShadow: '0 34px 90px rgba(0,0,0,.75)' }
    ], { duration: DUR, fill: 'forwards' });

    /* bring the finished print into view on shorter screens */
    later(function () {
      var want = br.top + window.scrollY - vh * 0.06;
      if (want > window.scrollY + 4) window.scrollTo({ top: want, behavior: reduce ? 'auto' : 'smooth' });
    }, reduce ? 0 : 1500);

    later(function () { paper.classList.add('sheen'); }, DUR - 400);
    later(function () {
      showDone('Photograph developed', 'Your print is ready.');
    }, DUR + 250);
  }

  /* ---------- Save the finished print ---------- */
  var dl = null, saveBtn = $('save'), saveNote = $('save-note');
  try {
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(function (d) { dl = d; saveBtn.hidden = !d; }, function () {});
    } else { saveBtn.hidden = false; }      // opened outside Claude: fall back to a normal browser download
  } catch (e) {}

  function renderFinal(longEdge) {
    var k = Math.min(1, longEdge / Math.max(exportSrc.width, exportSrc.height));
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(exportSrc.width * k)); c.height = Math.max(1, Math.round(exportSrc.height * k));
    var x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
    x.drawImage(exportSrc, 0, 0, c.width, c.height);
    grainify(c, 28, Math.max(2, Math.max(c.width, c.height) / 600), 11);
    return c;
  }
  function buildPrint(cb) {
    renderFinal(EXPORT_LONG).toBlob(function (b) { cb(b); }, 'image/jpeg', 0.92);
  }
  saveBtn.addEventListener('click', function () {
    saveBtn.disabled = true; saveNote.textContent = 'Preparing the print…';
    buildPrint(function (blob) {
      if (!blob) { saveNote.textContent = 'The print could not be prepared.'; saveBtn.disabled = false; return; }
      if (dl) {
        dl.save({ filename: 'digital-darkroom-print.jpg', data: blob }).then(
          function () { saveNote.textContent = 'Saved.'; saveBtn.disabled = false; },
          function (err) {
            saveNote.textContent = (err && err.code === 'declined') ? 'Not saved.' : 'Saving is not available here.';
            saveBtn.disabled = false;
          });
      } else {
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'digital-darkroom-print.jpg';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
        saveNote.textContent = ''; saveBtn.disabled = false;
      }
    });
  });


  function restart() {
    clearTimers();
    tx = 0; ty = 0; drag = null; placed = false;
    lamp.style.transition = ''; lamp.style.opacity = .35;
    devBarWrap.hidden = true; devFill.style.transition = 'none'; devFill.style.width = '0';
    devText.textContent = 'Drag the paper into the developer tray.';
    saveNote.textContent = ''; saveBtn.disabled = false;
    paper.getAnimations().forEach(function (an) { an.cancel(); });
    paper.classList.remove('developing', 'in-tray', 'lifted', 'agitating', 'revealed', 'sheen');
    $('bench').style.transition = ''; $('bench').style.minHeight = '';
    tray.style.transition = ''; tray.style.opacity = ''; tray.style.transform = '';
    paper.style.transition = 'none'; paper.style.transform = '';
    paper.setAttribute('tabindex', '0');
    tray.classList.remove('active', 'ready', 'agitating');
    grab.hidden = false;
    ctl4.hidden = false; done.hidden = true; setDots(false);
    stepName.textContent = 'Develop'; stepHint.textContent = 'Drag the paper into the developer tray.';
  }


  $('again').addEventListener('click', function () { restart(); window.scrollTo(0, 0); });
  setPhoto(sampleCanvas());
  restart();
})();

</script>

</body></html>
